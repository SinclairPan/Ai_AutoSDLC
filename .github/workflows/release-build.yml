name: Release Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only load probe or the one-shot release generation.
        required: true
        type: choice
        default: load_probe
        options:
          - load_probe
          - release
      tag:
        description: Release tag used to build the platform candidates.
        required: true
        default: v1.0.5
      expected_candidate_sha:
        description: Exact approved protected-main candidate merge SHA.
        required: true
        type: string

run-name: ${{ inputs.mode == 'release' && format('release-admission|{0}|g0', inputs.tag) || format('release-load-probe|{0}|{1}', inputs.tag, inputs.expected_candidate_sha) }}

permissions:
  contents: read

env:
  CURRENT_RELEASE_TAG: v1.0.5
  RELEASE_BOOTSTRAP_ENABLED: "false"
  RELEASE_PUBLISH_ENVIRONMENT: release-publish
  RELEASE_ENVIRONMENT_PROTECTION_VERIFIED: "false"
  RELEASE_TAG_RULESET_PROTECTION_VERIFIED: "false"
  RELEASE_USER_AGENT: ai-sdlc-release-writer/1.0

concurrency:
  group: release-build-${{ inputs.mode }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-load-probe:
    name: Read-only Release Workflow Load Probe
    if: inputs.mode == 'load_probe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prove exact protected-main workflow loadability
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected candidate SHA must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [[ "${EXPECTED_CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Load probe candidate does not match exact approved candidate." >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" ]]; then
            echo "Load probe must come from protected main." >&2
            exit 1
          fi
          live_main_sha="$(gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${live_main_sha}" != "${EXPECTED_CANDIDATE_SHA}" ]]; then
            echo "Protected main advanced beyond the approved load-probe candidate." >&2
            exit 1
          fi

  release-assurance-policy:
    name: Resolve Pre-tag Release Qualification Policy
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      authority_ref: ${{ steps.policy.outputs.authority_ref }}
    steps:
      - name: Require exact reviewed candidate
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected candidate SHA must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [[ "${EXPECTED_CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Workflow SHA ${GITHUB_SHA} does not match exact approved candidate ${EXPECTED_CANDIDATE_SHA}." >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" ]]; then
            echo "Release candidate authority must come from protected main." >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Release rerun is forbidden by terminal-generation-burn." >&2
            exit 1
          fi

      - name: Require current release generation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != "${CURRENT_RELEASE_TAG}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match current release generation ${CURRENT_RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Require future release generation enablement
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_BOOTSTRAP_ENABLED}" != "true" ]]; then
            echo "Release bootstrap is disabled for the frozen ${CURRENT_RELEASE_TAG} generation." >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Release rerun is forbidden by terminal-generation-burn." >&2
            exit 1
          fi
          if [[ "${RELEASE_ENVIRONMENT_PROTECTION_VERIFIED}" != "true" ]]; then
            echo "release-publish historical writer runs remain blocked until remote protection is independently verified." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG_RULESET_PROTECTION_VERIFIED}" != "true" ]]; then
            echo "software and Certificate tags remain blocked until the live no-bypass tag ruleset is independently verified." >&2
            exit 1
          fi

      - name: Checkout exact protected candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact pre-tag qualification policy
        id: policy
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" ]]; then
            echo "Release qualification authority must come from protected main." >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out candidate ${head_commit} does not match exact workflow SHA ${GITHUB_SHA}." >&2
            exit 1
          fi
          package_version="$(awk -F'"' '/^version =/ {print $2; exit}' pyproject.toml)"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi
          required_assets=(
            .github/ci/fast-gate-tests.txt
            .github/ci/test-baseline.json
            .github/ci/test-lineage.json
            scripts/ci_static_assurance.py
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "Release candidate is missing required static assurance asset: ${asset}" >&2
              exit 1
            fi
          done
          authority_ref="$(git rev-parse "HEAD^1")"
          echo "authority_ref=${authority_ref}" >> "${GITHUB_OUTPUT}"

      - name: Require admission namespaces absent before qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          certificate_tag="release-truth/${RELEASE_TAG}/certificate/g0"
          export certificate_tag
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
            > prequalification-tag-refs.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > prequalification-release-pages.json
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          target_ref = f"refs/tags/{os.environ['RELEASE_TAG']}"
          certificate_ref = f"refs/tags/{os.environ['certificate_tag']}"
          refs = {
              item.get("ref")
              for item in json.loads(
                  Path("prequalification-tag-refs.json").read_text(encoding="utf-8")
              )
          }
          pages = json.loads(
              Path("prequalification-release-pages.json").read_text(encoding="utf-8")
          )
          release_tags = {
              release.get("tag_name") for page in pages for release in page
          }
          if target_ref in refs or os.environ["RELEASE_TAG"] in release_tags:
              raise SystemExit("release namespace already exists before qualification")
          if certificate_ref in refs or os.environ["certificate_tag"] in release_tags:
              raise SystemExit("certificate namespace already exists before qualification")
          PY

      - name: Set up policy authority Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install policy authority runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Detect duplicate actual release dispatch in trusted Actions history
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/release-build.yml"
          accepted="false"
          for query_attempt in 1 2 3 4 5; do
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > "policy-current-run-${query_attempt}.json"
            workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0)' \
              "policy-current-run-${query_attempt}.json")"
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=100" \
              > "policy-run-pages-${query_attempt}.json"
            workflow_snapshots="policy-run-workflows-${query_attempt}"
            mkdir -p "${workflow_snapshots}"
            jq -r --arg path "${workflow_path}" --arg title "release-admission|${RELEASE_TAG}|g0" \
              '.[] | .workflow_runs[]? | select(.path == $path and .event == "workflow_dispatch" and .display_title == $title) | .head_sha' \
              "policy-run-pages-${query_attempt}.json" | sort -u > "policy-run-shas-${query_attempt}.txt"
            while IFS= read -r run_sha; do
              [[ -z "${run_sha}" ]] && continue
              if [[ ! "${run_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Release run history contains a non-canonical candidate SHA." >&2
                exit 1
              fi
              gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
                "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${run_sha}" \
                --jq '.content' | base64 --decode > "${workflow_snapshots}/${run_sha}.yml"
            done < "policy-run-shas-${query_attempt}.txt"
            if uv run python scripts/release_truth.py run-authority-check \
              --current-run "policy-current-run-${query_attempt}.json" \
              --run-pages "policy-run-pages-${query_attempt}.json" \
              --workflow-snapshots "${workflow_snapshots}" \
              --release-tag "${RELEASE_TAG}" --generation g0 \
              --expected-candidate-sha "${EXPECTED_CANDIDATE_SHA}" \
              --current-run-id "${GITHUB_RUN_ID}" --workflow-path "${workflow_path}" \
              --output "policy-run-authority-${query_attempt}.json"; then
              cp "policy-run-authority-${query_attempt}.json" release-run-authority.json
              accepted="true"
              break
            fi
            sleep 2
          done
          if [[ "${accepted}" != "true" ]]; then
            echo "Actual release dispatch authority did not become uniquely observable." >&2
            exit 1
          fi

      - name: Query live no-bypass tag ruleset authority before qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 精确保护 refs/tags/v* 与 refs/tags/release-truth/v*/certificate/g0；创建仅由单一 writer 执行。
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > policy-ruleset-list.json
          jq -r '.[] | select(.target == "tag") | .id' policy-ruleset-list.json > policy-tag-ruleset-ids.txt
          : > policy-tag-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" >> policy-tag-rulesets.jsonl
          done < policy-tag-ruleset-ids.txt
          jq -s '.' policy-tag-rulesets.jsonl > policy-tag-rulesets.json
          uv run python scripts/release_truth.py ruleset-check \
            --rulesets policy-tag-rulesets.json --repository "${GITHUB_REPOSITORY}" \
            --output policy-tag-ruleset-authority.json

  release-assurance:
    needs: release-assurance-policy
    uses: ./.github/workflows/compatibility-gate.yml
    with:
      candidate_ref: ${{ github.sha }}
      authority_ref: ${{ needs.release-assurance-policy.outputs.authority_ref }}
      force_full: true

  build-smoke-candidate:
    needs: [release-assurance-policy, release-assurance]
    if: >-
      always() &&
      needs.release-assurance-policy.result == 'success' &&
      needs.release-assurance.result == 'success'
    name: ${{ matrix.asset_os }} ${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_os: windows
            asset_machine: amd64
            runner: windows-latest
            archive: zip
          - asset_os: macos
            asset_machine: arm64
            runner: macos-latest
            archive: tar.gz
          - asset_os: linux
            asset_machine: amd64
            runner: ubuntu-latest
            archive: tar.gz

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact protected candidate source
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk -F'"' '/^version =/ {print $2; exit}' pyproject.toml)"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out source ${head_commit} does not match exact workflow SHA ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Compute platform asset suffix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "${os}" in
            darwin) os="macos" ;;
            linux) os="linux" ;;
          esac
          machine="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "${machine}" in
            x86_64|amd64) machine="amd64" ;;
            arm64|aarch64) machine="arm64" ;;
          esac
          echo "AI_SDLC_OFFLINE_ASSET_SUFFIX=-${os}-${machine}" >> "${GITHUB_ENV}"
          echo "AI_SDLC_RELEASE_ASSET_OS=${os}" >> "${GITHUB_ENV}"
          echo "AI_SDLC_RELEASE_ASSET_MACHINE=${machine}" >> "${GITHUB_ENV}"

      - name: Compute Windows asset suffix
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -eq "x64" -or $arch -eq "x86_64") {
            $arch = "amd64"
          } elseif ($arch -eq "aarch64") {
            $arch = "arm64"
          }
          "AI_SDLC_OFFLINE_ASSET_SUFFIX=-windows-$arch" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AI_SDLC_RELEASE_ASSET_OS=windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AI_SDLC_RELEASE_ASSET_MACHINE=$arch" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AI_SDLC_OFFLINE_PYTHON_VERSIONS=3.11,3.12" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AI_SDLC_OFFLINE_TARGET_PLATFORM=win_$arch" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build offline bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AI_SDLC_RELEASE_ASSET_OS}" != "${{ matrix.asset_os }}" || "${AI_SDLC_RELEASE_ASSET_MACHINE}" != "${{ matrix.asset_machine }}" ]]; then
            echo "Runner identity ${AI_SDLC_RELEASE_ASSET_OS}-${AI_SDLC_RELEASE_ASSET_MACHINE} does not match required release asset ${{ matrix.asset_os }}-${{ matrix.asset_machine }}." >&2
            exit 1
          fi
          uv python install 3.11
          runtime_python="$(uv python find --managed-python 3.11)"
          if command -v cygpath >/dev/null 2>&1; then
            runtime_python="$(cygpath -u "${runtime_python}")"
          fi
          runtime_dir="$(dirname "${runtime_python}")"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            runtime_root="${runtime_dir}"
          else
            runtime_root="$(cd "${runtime_dir}/.." && pwd)"
          fi
          PYTHON="${runtime_python}" \
            AI_SDLC_OFFLINE_PYTHON_RUNTIME="${runtime_root}" \
            AI_SDLC_OFFLINE_ASSET_SUFFIX="${AI_SDLC_OFFLINE_ASSET_SUFFIX}" \
            AI_SDLC_OFFLINE_PYTHON_VERSIONS="${AI_SDLC_OFFLINE_PYTHON_VERSIONS:-}" \
            AI_SDLC_OFFLINE_TARGET_PLATFORM="${AI_SDLC_OFFLINE_TARGET_PLATFORM:-}" \
            bash packaging/offline/build_offline_bundle.sh

      - name: Smoke Windows zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8

          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $archivePath = Join-Path "dist-offline" "ai-sdlc-offline-$releaseVersion-$env:AI_SDLC_RELEASE_ASSET_OS-$env:AI_SDLC_RELEASE_ASSET_MACHINE.zip"
          $archive = Get-Item -LiteralPath $archivePath -ErrorAction SilentlyContinue
          $checksumPath = "$($archive.FullName).sha256"
          if (-not $archive -or -not (Test-Path -LiteralPath $checksumPath)) {
            throw "Expected exact platform zip archive and SHA256 sidecar were not produced: $archivePath"
          }
          $checksumParts = (Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+', 2
          $actualArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if (
            $checksumParts.Count -ne 2 -or
            $checksumParts[1] -ne $archive.Name -or
            $checksumParts[0].ToLowerInvariant() -ne $actualArchiveHash
          ) {
            throw "Archive SHA256 verification failed before extraction: $($archive.Name)"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-build-smoke"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-build-evidence"
          Remove-Item -Recurse -Force $smokeRoot, $evidenceRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot, $evidenceRoot | Out-Null

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot -Force
          $bundleDir = Get-ChildItem -Path $smokeRoot -Directory | Select-Object -First 1
          if (-not $bundleDir) {
            throw "Expanded archive did not contain a bundle directory."
          }

          python packaging/offline/verify_offline_bundle.py $bundleDir.FullName `
            --require-bundled-runtime `
            --require-checksums `
            --expected-package-version $releaseVersion `
            --archive-checksum $archive.FullName $checksumPath
          if ($LASTEXITCODE -ne 0) {
            throw "Pre-install verify_offline_bundle.py failed with exit code $LASTEXITCODE"
          }

          $digest = (Get-FileHash -Algorithm SHA256 "AGENTS.md").Hash.ToLowerInvariant()
          $env:OPENAI_CODEX = "1"
          $env:AI_SDLC_ADAPTER_CANONICAL_SHA256 = "sha256:$digest"
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path $windowsPowerShell)) {
            throw "Expected Windows PowerShell 5.1 at $windowsPowerShell"
          }

          Push-Location $bundleDir.FullName
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\install_offline.ps1 -AddToPath *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "install.log")
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell install_offline.ps1 failed with exit code $LASTEXITCODE"
          }
          Pop-Location

          python packaging/offline/verify_offline_bundle.py $bundleDir.FullName `
            --require-bundled-runtime `
            --expected-package-version $releaseVersion `
            --install-log (Join-Path $evidenceRoot "install.log")
          if ($LASTEXITCODE -ne 0) {
            throw "verify_offline_bundle.py failed with exit code $LASTEXITCODE"
          }

          $cliDir = Join-Path $bundleDir.FullName ".venv\Scripts"
          $env:Path = $cliDir + [IO.Path]::PathSeparator + $env:Path
          if (-not (Get-Command ai-sdlc -ErrorAction SilentlyContinue)) {
            throw "Expected ai-sdlc to resolve on PATH after -AddToPath install."
          }
          ai-sdlc --help *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "help.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "ai-sdlc --help failed with exit code $LASTEXITCODE"
          }
          $actualVersion = (ai-sdlc --version).Trim()
          $expectedVersion = $env:RELEASE_TAG.Substring(1)
          if ($actualVersion -ne $expectedVersion) {
            throw "Installed CLI version $actualVersion does not match release tag $env:RELEASE_TAG."
          }
          $actualVersion | Out-File -FilePath (Join-Path $evidenceRoot "version.txt") -Encoding utf8
          Push-Location $env:GITHUB_WORKSPACE
          ai-sdlc adapter status *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "adapter-status.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "ai-sdlc adapter status failed with exit code $LASTEXITCODE"
          }
          ai-sdlc run --dry-run *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "run-dry-run.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "ai-sdlc run --dry-run failed with exit code $LASTEXITCODE"
          }
          Pop-Location
          Copy-Item -LiteralPath (Join-Path $bundleDir.FullName "bundle-manifest.json") -Destination $evidenceRoot

      - name: Smoke POSIX tar
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          archive="dist-offline/ai-sdlc-offline-${release_version}-${AI_SDLC_RELEASE_ASSET_OS}-${AI_SDLC_RELEASE_ASSET_MACHINE}.tar.gz"
          checksum_path="${archive}.sha256"
          if [[ ! -f "${archive}" || ! -f "${checksum_path}" ]]; then
            echo "Expected exact platform tar archive and SHA256 sidecar were not produced: ${archive}" >&2
            exit 1
          fi
          checksum_line="$(tr -d '\r' < "${checksum_path}")"
          expected_archive_hash="${checksum_line%%  *}"
          sidecar_archive_name="${checksum_line#*  }"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_archive_hash="$(sha256sum "${archive}" | awk '{print $1}')"
          else
            actual_archive_hash="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          fi
          expected_archive_hash_lower="$(printf '%s' "${expected_archive_hash}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${expected_archive_hash}" =~ ^[0-9a-fA-F]{64}$ || "${sidecar_archive_name}" != "$(basename "${archive}")" || "${actual_archive_hash}" != "${expected_archive_hash_lower}" ]]; then
            echo "Archive SHA256 verification failed before extraction: ${archive}" >&2
            exit 1
          fi

          smoke_root="${RUNNER_TEMP}/ai-sdlc-release-build-smoke"
          evidence_root="${RUNNER_TEMP}/ai-sdlc-release-build-evidence"
          rm -rf "${smoke_root}" "${evidence_root}"
          mkdir -p "${smoke_root}" "${evidence_root}"

          tar xzf "${archive}" -C "${smoke_root}"
          bundle_dir="$(find "${smoke_root}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [[ -z "${bundle_dir}" ]]; then
            echo "Expanded archive did not contain a bundle directory." >&2
            exit 1
          fi

          python packaging/offline/verify_offline_bundle.py "${bundle_dir}" \
            --require-bundled-runtime \
            --require-checksums \
            --expected-package-version "${release_version}" \
            --archive-checksum "${archive}" "${checksum_path}"

          digest="$(python - <<'PY'
          from pathlib import Path
          import hashlib
          print(hashlib.sha256(Path("AGENTS.md").read_bytes()).hexdigest())
          PY
          )"
          export OPENAI_CODEX=1
          export AI_SDLC_ADAPTER_CANONICAL_SHA256="sha256:${digest}"

          (
            cd "${bundle_dir}"
            ./install_offline.sh --add-to-path 2>&1 | tee "${evidence_root}/install.log"
          )

          python packaging/offline/verify_offline_bundle.py "${bundle_dir}" \
            --require-bundled-runtime \
            --expected-package-version "${release_version}" \
            --install-log "${evidence_root}/install.log"

          export PATH="${HOME}/.local/bin:${PATH}"
          command -v ai-sdlc >/dev/null
          ai-sdlc --help 2>&1 | tee "${evidence_root}/help.txt"
          actual_version="$(ai-sdlc --version)"
          if [[ "${actual_version}" != "${release_version}" ]]; then
            echo "Installed CLI version ${actual_version} does not match release tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          printf '%s\n' "${actual_version}" > "${evidence_root}/version.txt"
          ai-sdlc adapter status 2>&1 | tee "${evidence_root}/adapter-status.txt"
          ai-sdlc run --dry-run 2>&1 | tee "${evidence_root}/run-dry-run.txt"
          cp "${bundle_dir}/bundle-manifest.json" "${evidence_root}/"

      - name: Upload build smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.asset_os }}-${{ matrix.archive }}-evidence
          path: ${{ runner.temp }}/ai-sdlc-release-build-evidence
          if-no-files-found: error

      - name: Upload smoke-passed candidate asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.asset_os }}-${{ matrix.asset_machine }}
          path: |
            dist-offline/ai-sdlc-offline-*-${{ matrix.asset_os }}-${{ matrix.asset_machine }}.${{ matrix.archive }}
            dist-offline/ai-sdlc-offline-*-${{ matrix.asset_os }}-${{ matrix.asset_machine }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release-qualification:
    name: Release Qualification
    needs:
      - release-assurance-policy
      - release-assurance
      - build-smoke-candidate
    if: >-
      always() &&
      needs.release-assurance-policy.result == 'success' &&
      needs.release-assurance.result == 'success' &&
      needs.build-smoke-candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate exact qualification result
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact protected-main candidate passed Release Assurance and all three Build Smoke candidates."

  build-release-proof:
    name: Build Release Proof Inputs
    needs: [release-qualification]
    if: needs.release-qualification.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact protected verifier revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-writer

      - name: Download exact run-attempt candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-proof-inputs/candidates
          merge-multiple: true

      - name: Freeze protected Gate and candidate inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" ]]; then
            echo "Release writer authority must come from protected main." >&2
            exit 1
          fi
          head_commit="$(git -C trusted-writer rev-parse HEAD)"
          if [[ "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Proof input checkout ${head_commit} does not match exact workflow SHA ${GITHUB_SHA}." >&2
            exit 1
          fi
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > release-qualification-jobs.json
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-proof-inputs")
          pages = json.loads(
              Path("release-qualification-jobs.json").read_text(encoding="utf-8")
          )
          matches = [
              job
              for page in pages
              for job in page.get("jobs", [])
              if job.get("name") == "Release Qualification"
              and job.get("status") == "completed"
              and job.get("conclusion") == "success"
              and job.get("run_id") == int(os.environ["GITHUB_RUN_ID"])
              and job.get("run_attempt") == int(os.environ["GITHUB_RUN_ATTEMPT"])
              and job.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "expected exactly one successful completed Release Qualification job"
              )
          qualification = matches[0]
          if not isinstance(qualification.get("id"), int) or qualification["id"] < 1:
              raise SystemExit("Release Qualification job ID is invalid")
          if not qualification.get("completed_at"):
              raise SystemExit("Release Qualification completion time is absent")

          candidates = root / "candidates"
          files = sorted(path for path in candidates.iterdir() if path.is_file())
          archives = [path for path in files if not path.name.endswith(".sha256")]
          sidecars = [path for path in files if path.name.endswith(".sha256")]
          if len(archives) != 3 or len(sidecars) != 3 or len(files) != 6:
              raise SystemExit("expected exactly three archives and three SHA256 sidecars")

          assets = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name.endswith(".sha256"):
                  archive_name = path.name.removesuffix(".sha256")
                  line = path.read_text(encoding="utf-8").strip().split()
                  if len(line) != 2 or line[1] != archive_name:
                      raise SystemExit(f"invalid checksum sidecar: {path.name}")
                  archive = candidates / archive_name
                  if not archive.is_file() or line[0].lower() != hashlib.sha256(archive.read_bytes()).hexdigest():
                      raise SystemExit(f"checksum sidecar differs: {path.name}")
              platform = next(
                  (value for value in ("linux-amd64", "macos-arm64", "windows-amd64") if value in path.name),
                  None,
              )
              if platform is None:
                  raise SystemExit(f"unknown release asset platform: {path.name}")
              assets.append(
                  {
                      "name": path.name,
                      "digest": f"sha256:{digest}",
                      "size_bytes": path.stat().st_size,
                      "platform": platform,
                  }
              )

          gates = [
              {
                  "name": "Release Qualification",
                  "conclusion": qualification["conclusion"],
                  "workflow_job_id": qualification["id"],
                  "completed_at": qualification["completed_at"],
                  "head_sha": qualification["head_sha"],
              }
          ]
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "release_tag": os.environ["RELEASE_TAG"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "gates": gates,
              "assets": assets,
          }
          (root / "release-proof-inputs.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload immutable run-attempt proof inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-proof-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-proof-inputs
          if-no-files-found: error

  publish-release:
    name: Publish Proof-bound Release
    needs: [build-release-proof]
    if: inputs.mode == 'release' && needs.build-release-proof.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_USER_AGENT: ai-sdlc-release-writer/1.0
      GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout exact protected writer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-writer

      - name: Set up protected writer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install protected writer runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Revalidate protected candidate after action setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted-writer rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C trusted-writer status --porcelain --untracked-files=no)"

      - name: Download exact proof inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-proof-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-proof-inputs

      - name: Require all release admission namespaces absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_BOOTSTRAP_ENABLED}" != "true" ]]; then
            echo "Release bootstrap is disabled for the frozen ${CURRENT_RELEASE_TAG} generation." >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Release rerun is forbidden by terminal-generation-burn." >&2
            exit 1
          fi
          if [[ "${RELEASE_ENVIRONMENT_PROTECTION_VERIFIED}" != "true" ]]; then
            echo "release-publish historical writer runs remain blocked until remote protection is independently verified." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG_RULESET_PROTECTION_VERIFIED}" != "true" ]]; then
            echo "software and Certificate tags remain blocked until the live no-bypass tag ruleset is independently verified." >&2
            exit 1
          fi
          certificate_tag="release-truth/${RELEASE_TAG}/certificate/g0"
          export certificate_tag
          git -C trusted-writer show-ref --tags > local-tag-refs.txt || true
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
            > remote-tag-refs.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-admission-pages.json
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          target_ref = f"refs/tags/{os.environ['RELEASE_TAG']}"
          certificate_ref = f"refs/tags/{os.environ['certificate_tag']}"
          local_refs = {
              line.split(maxsplit=1)[1]
              for line in Path("local-tag-refs.txt").read_text(encoding="utf-8").splitlines()
              if len(line.split(maxsplit=1)) == 2
          }
          remote_refs = {
              item.get("ref")
              for item in json.loads(
                  Path("remote-tag-refs.json").read_text(encoding="utf-8")
              )
          }
          pages = json.loads(
              Path("release-admission-pages.json").read_text(encoding="utf-8")
          )
          releases = [release for page in pages for release in page]
          release_tags = {release.get("tag_name") for release in releases}
          if (
              target_ref in local_refs
              or target_ref in remote_refs
              or os.environ["RELEASE_TAG"] in release_tags
          ):
              raise SystemExit("release namespace already exists")
          if (
              certificate_ref in local_refs
              or certificate_ref in remote_refs
              or os.environ["certificate_tag"] in release_tags
          ):
              raise SystemExit("certificate namespace already exists")
          PY

      - name: Freeze live no-bypass tag ruleset authority for admission
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > ruleset-list.json
          jq -r '.[] | select(.target == "tag") | .id' ruleset-list.json > tag-ruleset-ids.txt
          : > tag-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" >> tag-rulesets.jsonl
          done < tag-ruleset-ids.txt
          jq -s '.' tag-rulesets.jsonl > tag-rulesets.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py ruleset-check \
            --rulesets tag-rulesets.json --repository "${GITHUB_REPOSITORY}" \
            --output release-tag-ruleset-authority.json

      - name: Validate current gate freshness before admission mutation
        shell: bash
        run: |
          set -euo pipefail
          uv run --project trusted-writer python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from ai_sdlc.core.release_truth import RELEASE_TRUTH_FRESHNESS_TTL

          now = datetime.now(UTC)
          inputs = json.loads(Path("release-proof-inputs/release-proof-inputs.json").read_text(encoding="utf-8"))
          for gate in inputs["gates"]:
              completed = datetime.fromisoformat(gate["completed_at"].removesuffix("Z") + "+00:00")
              if now < completed or now > completed + RELEASE_TRUTH_FRESHNESS_TTL:
                  raise SystemExit("required gate is not fresh at admission mutation")
          PY

      - name: Revalidate trusted Actions duplicate-run detector before mutation
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/release-build.yml"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > writer-current-run.json
          workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0)' writer-current-run.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=100" \
            > writer-run-pages.json
          workflow_snapshots="writer-run-workflows"
          mkdir -p "${workflow_snapshots}"
          jq -r --arg path "${workflow_path}" --arg title "release-admission|${RELEASE_TAG}|g0" \
            '.[] | .workflow_runs[]? | select(.path == $path and .event == "workflow_dispatch" and .display_title == $title) | .head_sha' \
            writer-run-pages.json | sort -u > writer-run-shas.txt
          while IFS= read -r run_sha; do
            [[ -z "${run_sha}" ]] && continue
            if [[ ! "${run_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release run history contains a non-canonical candidate SHA." >&2
              exit 1
            fi
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${run_sha}" \
              --jq '.content' | base64 --decode > "${workflow_snapshots}/${run_sha}.yml"
          done < writer-run-shas.txt
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py run-authority-check \
            --current-run writer-current-run.json --run-pages writer-run-pages.json \
            --workflow-snapshots "${workflow_snapshots}" \
            --release-tag "${RELEASE_TAG}" --generation g0 \
            --expected-candidate-sha "${EXPECTED_CANDIDATE_SHA}" \
            --current-run-id "${GITHUB_RUN_ID}" --workflow-path "${workflow_path}" \
            --output writer-run-authority.json
          live_main_sha="$(gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${live_main_sha}" != "${EXPECTED_CANDIDATE_SHA}" ]]; then
            echo "Protected main advanced beyond the exact approved release candidate." >&2
            exit 1
          fi

      - name: Create exact annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          request = {
              "tag": os.environ["RELEASE_TAG"],
              "message": (
                  f"AI-SDLC {os.environ['RELEASE_TAG']}\n\n"
                  f"run_id={os.environ['GITHUB_RUN_ID']} "
                  f"run_attempt={os.environ['GITHUB_RUN_ATTEMPT']} "
                  f"workflow_ref={os.environ['GITHUB_WORKFLOW_REF']} "
                  f"commit={os.environ['GITHUB_SHA']} "
                  "failure_policy=terminal-generation-burn; "
                  "no cleanup, edit, reuse, or rerun"
              ),
              "object": os.environ["GITHUB_SHA"],
              "type": "commit",
          }
          Path("annotated-tag-request.json").write_text(
              json.dumps(request, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          PY
          gh api --method POST \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            --input annotated-tag-request.json > annotated-tag.json
          tag_object_sha="$(jq -er '.sha' annotated-tag.json)"
          if [[ "$(jq -r '.tag' annotated-tag.json)" != "${RELEASE_TAG}" ]] \
            || [[ "$(jq -r '.object.type' annotated-tag.json)" != "commit" ]] \
            || [[ "$(jq -r '.object.sha' annotated-tag.json)" != "${GITHUB_SHA}" ]]; then
            echo "Created annotated tag object differs from exact candidate." >&2
            exit 1
          fi
          jq -n \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "${tag_object_sha}" \
            '{ref:$ref,sha:$sha}' > release-tag-ref-request.json
          gh api --method POST \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            --input release-tag-ref-request.json > release-tag-ref.json
          if [[ "$(jq -r '.ref' release-tag-ref.json)" != "refs/tags/${RELEASE_TAG}" ]] \
            || [[ "$(jq -r '.object.sha' release-tag-ref.json)" != "${tag_object_sha}" ]]; then
            echo "Created release Git ref differs from annotated tag authority." >&2
            exit 1
          fi

      - name: Create fresh zero-asset Draft admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          request = {
              "tag_name": os.environ["RELEASE_TAG"],
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": f"AI-SDLC {os.environ['RELEASE_TAG']}",
              "body": (
                  f"Qualified protected-main release {os.environ['RELEASE_TAG']}.\n\n"
                  f"run_id={os.environ['GITHUB_RUN_ID']} "
                  f"run_attempt={os.environ['GITHUB_RUN_ATTEMPT']} "
                  f"workflow_ref={os.environ['GITHUB_WORKFLOW_REF']} "
                  f"commit={os.environ['GITHUB_SHA']} "
                  "failure_policy=terminal-generation-burn; "
                  "no cleanup, edit, reuse, or rerun"
              ),
              "draft": True,
              "prerelease": False,
              "make_latest": "false",
          }
          Path("release-create-request.json").write_text(
              json.dumps(request, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          PY
          gh api --method POST \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/releases" \
            --input release-create-request.json > release-authority.json
          tag_tree_sha="$(git -C trusted-writer rev-parse "${GITHUB_SHA}^{tree}")"
          export tag_tree_sha
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-authority.json").read_text(encoding="utf-8"))
          tag = json.loads(Path("annotated-tag.json").read_text(encoding="utf-8"))
          ruleset = json.loads(
              Path("release-tag-ruleset-authority.json").read_text(encoding="utf-8")
          )
          if (
              release.get("tag_name") != os.environ["RELEASE_TAG"]
              or release.get("target_commitish") != os.environ["GITHUB_SHA"]
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("assets") != []
              or not isinstance(release.get("id"), int)
              or not release.get("upload_url")
          ):
              raise SystemExit("created release differs from exact zero-asset Draft admission")
          admission_id = (
              f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}:"
              f"{tag['sha']}:{release['id']}"
          )
          admission = {
              "admission_id": admission_id,
              "numeric_release_id": release["id"],
              "upload_url": release["upload_url"],
              "tag_object_sha": tag["sha"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "expected_candidate_sha": os.environ["EXPECTED_CANDIDATE_SHA"],
              "tree_sha": os.environ["tag_tree_sha"],
              "tag_ruleset_id": ruleset["ruleset_id"],
              "tag_ruleset_digest": ruleset["ruleset_digest"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "user_agent": os.environ["RELEASE_USER_AGENT"],
              "failure_policy": "terminal-generation-burn",
          }
          encoded = json.dumps(
              admission, ensure_ascii=False, separators=(",", ":"), sort_keys=True
          ).encode()
          admission_digest = "sha256:" + hashlib.sha256(encoded).hexdigest()
          admission["admission_digest"] = admission_digest
          Path("release-admission.json").write_text(
              json.dumps(admission, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"RELEASE_ID={release['id']}\n")
          PY

      - name: Validate live frozen admission authority before candidate upload
        shell: bash
        run: |
          set -euo pipefail
          tag_object_sha="$(jq -er '.tag_object_sha' release-admission.json)"
          commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${commit_sha}" > live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > live-release.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py authority-check \
            --admission release-admission.json --ref live-ref.json --tag live-tag.json \
            --commit live-commit.json --release live-release.json \
            --release-tag "${RELEASE_TAG}" --release-state draft

      - name: Validate current gate freshness before candidate upload
        shell: bash
        run: |
          set -euo pipefail
          uv run --project trusted-writer python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from ai_sdlc.core.release_truth import RELEASE_TRUTH_FRESHNESS_TTL

          now = datetime.now(UTC)
          inputs = json.loads(Path("release-proof-inputs/release-proof-inputs.json").read_text(encoding="utf-8"))
          for gate in inputs["gates"]:
              completed = datetime.fromisoformat(gate["completed_at"].removesuffix("Z") + "+00:00")
              if now < completed or now > completed + RELEASE_TRUTH_FRESHNESS_TTL:
                  raise SystemExit("required gate is not fresh before candidate upload")
          PY

      - name: Upload exact candidate assets to fresh zero-asset Draft
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-before.json
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          release = json.loads(Path("release-before.json").read_text(encoding="utf-8"))
          proof_inputs = json.loads(
              Path("release-proof-inputs/release-proof-inputs.json").read_text(encoding="utf-8")
          )
          if not release["draft"] or release["prerelease"]:
              raise SystemExit("software release must be a non-prerelease Draft")
          if release["assets"]:
              raise SystemExit("fresh release generation requires a zero-asset Draft")
          expected = {asset["name"]: asset for asset in proof_inputs["assets"]}
          Path("assets-to-upload.txt").write_text(
              "\n".join(expected) + ("\n" if expected else ""), encoding="utf-8"
          )
          PY
          while IFS= read -r asset_name || [[ -n "${asset_name}" ]]; do
            [[ -z "${asset_name}" ]] && continue
            uv run --project trusted-writer python trusted-writer/scripts/release_truth.py upload-asset \
              --authority release-authority.json \
              --asset "release-proof-inputs/candidates/${asset_name}" \
              --repository "${GITHUB_REPOSITORY}" \
              --user-agent "${RELEASE_USER_AGENT}"
          done < assets-to-upload.txt
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-after-upload.json
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(
              Path("release-after-upload.json").read_text(encoding="utf-8")
          )
          proof_inputs = json.loads(
              Path("release-proof-inputs/release-proof-inputs.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_names = [asset["name"] for asset in proof_inputs["assets"]]
          live_names = [
              asset["name"]
              for asset in release["assets"]
              if asset["name"] != "release-satisfaction-proof.json"
          ]
          if len(expected_names) != 6 or len(set(expected_names)) != 6:
              raise SystemExit("Proof inputs must contain exactly six unique candidate assets")
          if len(live_names) != 6 or set(live_names) != set(expected_names):
              raise SystemExit(
                  "Draft candidate asset set must contain exactly six expected assets"
              )
          PY

      - name: Validate live frozen admission authority before Proof
        shell: bash
        run: |
          set -euo pipefail
          tag_object_sha="$(jq -er '.tag_object_sha' release-admission.json)"
          commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${commit_sha}" > live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > live-release.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py authority-check \
            --admission release-admission.json --ref live-ref.json --tag live-tag.json \
            --commit live-commit.json --release live-release.json \
            --release-tag "${RELEASE_TAG}" --release-state draft

      - name: Build canonical Proof from live Draft authority
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-cas.json
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from ai_sdlc.core.release_truth import RELEASE_TRUTH_FRESHNESS_TTL

          inputs = json.loads(
              Path("release-proof-inputs/release-proof-inputs.json").read_text(encoding="utf-8")
          )
          admission = json.loads(
              Path("release-admission.json").read_text(encoding="utf-8")
          )
          release = json.loads(Path("release-cas.json").read_text(encoding="utf-8"))
          if (
              not release["draft"]
              or release["tag_name"] != inputs["release_tag"]
              or release["id"] != admission["numeric_release_id"]
              or admission["workflow_run_id"] != inputs["workflow_run_id"]
              or admission["workflow_run_attempt"] != inputs["workflow_run_attempt"]
          ):
              raise SystemExit("live Draft identity differs")
          expected = sorted(inputs["assets"], key=lambda value: value["name"])
          live = {
              asset["name"]: asset
              for asset in release["assets"]
              if asset["name"] != "release-satisfaction-proof.json"
          }
          if set(live) != {asset["name"] for asset in expected}:
              raise SystemExit("live Draft asset set differs")
          for binding in expected:
              asset = live[binding["name"]]
              if asset.get("digest") != binding["digest"] or asset["size"] != binding["size_bytes"]:
                  raise SystemExit(f"live Draft asset differs: {binding['name']}")

          def digest(value: object) -> str:
              encoded = json.dumps(
                  value, ensure_ascii=False, separators=(",", ":"), sort_keys=True
              ).encode()
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          cutoff = datetime.now(UTC).replace(microsecond=0)
          gate_names = sorted(gate["name"] for gate in inputs["gates"])
          gates = []
          for gate in sorted(inputs["gates"], key=lambda value: value["name"]):
              completed_at = datetime.fromisoformat(gate["completed_at"].removesuffix("Z") + "+00:00")
              valid_until = completed_at + RELEASE_TRUTH_FRESHNESS_TTL
              evidence = {
                  "name": gate["name"],
                  "conclusion": gate["conclusion"],
                  "workflow_run_id": inputs["workflow_run_id"],
                  "workflow_run_attempt": inputs["workflow_run_attempt"],
                  "workflow_job_id": gate["workflow_job_id"],
                  "head_sha": gate["head_sha"],
                  "completed_at": gate["completed_at"],
              }
              gates.append(
                  {
                      **evidence,
                      "required": True,
                      "protected": True,
                      "authority_repository": inputs["repository"],
                      "workflow_ref": inputs["workflow_ref"],
                      "valid_until": valid_until.isoformat().replace("+00:00", "Z"),
                      "evidence_digest": digest(evidence),
                  }
              )
          settings = {
              "id": release["id"],
              "name": release["name"],
              "body": release.get("body"),
              "tag_name": release["tag_name"],
              "target_commitish": release["target_commitish"],
              "draft": release["draft"],
              "prerelease": release["prerelease"],
          }
          snapshot = {
              "repository": inputs["repository"],
              "admission_id": admission["admission_id"],
              "admission_digest": admission["admission_digest"],
              "draft_release_id": release["id"],
              "upload_url": admission["upload_url"],
              "release_user_agent": admission["user_agent"],
              "draft_release_updated_at": release["updated_at"],
              "draft": release["draft"],
              "tag_name": release["tag_name"],
              "tag_object_sha": admission["tag_object_sha"],
              "commit_sha": admission["commit_sha"],
              "tree_sha": admission["tree_sha"],
              "tag_ruleset_id": admission["tag_ruleset_id"],
              "tag_ruleset_digest": admission["tag_ruleset_digest"],
              "required_policy_digest": digest(
                  {"required_gate_names": gate_names, "workflow_ref": inputs["workflow_ref"]}
              ),
              "required_gate_names": gate_names,
              "required_gates": gates,
              "workflow_run_id": inputs["workflow_run_id"],
              "workflow_run_attempt": inputs["workflow_run_attempt"],
              "expected_assets": expected,
              "assets": expected,
              "release_settings_digest": digest(settings),
              "publish_workflow_ref": inputs["workflow_ref"],
              "evidence_cutoff_at": cutoff.isoformat().replace("+00:00", "Z"),
          }
          Path("release-candidate-snapshot.json").write_text(
              json.dumps(snapshot, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          PY
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py proof \
            --snapshot release-candidate-snapshot.json \
            --output release-satisfaction-proof.json

      - name: Validate live frozen admission authority before Proof attachment and publish
        shell: bash
        run: |
          set -euo pipefail
          tag_object_sha="$(jq -er '.tag_object_sha' release-admission.json)"
          commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${commit_sha}" > live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > live-release.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py authority-check \
            --admission release-admission.json --ref live-ref.json --tag live-tag.json \
            --commit live-commit.json --release live-release.json \
            --release-tag "${RELEASE_TAG}" --release-state draft

      - name: Validate current gate freshness before Proof attachment and publish
        shell: bash
        run: |
          set -euo pipefail
          publish_observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py publish-check \
            --proof release-satisfaction-proof.json \
            --snapshot release-candidate-snapshot.json \
            --caller-workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --caller-run-id "${{ github.run_id }}" \
            --caller-run-attempt "${{ github.run_attempt }}" \
            --observed-at "${publish_observed_at}"

      - name: Linearize Publish with Proof CAS
        shell: bash
        run: |
          set -euo pipefail
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py upload-asset \
            --authority release-authority.json \
            --asset release-satisfaction-proof.json \
            --repository "${GITHUB_REPOSITORY}" \
            --user-agent "${RELEASE_USER_AGENT}"

          gh api --include \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > release-before-publish.http
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          response = Path("release-before-publish.http").read_bytes()
          separator = b"\r\n\r\n" if b"\r\n\r\n" in response else b"\n\n"
          raw_headers, found, body = response.partition(separator)
          if not found:
              raise SystemExit("Draft response did not include HTTP headers")
          etag = next(
              (
                  line.partition(":")[2].strip()
                  for line in raw_headers.decode("iso-8859-1").splitlines()
                  if line.partition(":")[0].lower() == "etag"
              ),
              "",
          )
          if not etag:
              raise SystemExit("Draft response did not include an ETag")
          Path("release-publish-etag.txt").write_text(etag, encoding="ascii")
          Path("release-before-publish.json").write_bytes(body)

          before = json.loads(Path("release-cas.json").read_text(encoding="utf-8"))
          current = json.loads(body)
          if not current["draft"] or current["id"] != before["id"]:
              raise SystemExit("Draft identity changed after Proof CAS")
          settings = ("name", "body", "tag_name", "target_commitish", "draft", "prerelease")
          if any(current[key] != before[key] for key in settings):
              raise SystemExit("Draft settings changed after Proof CAS")
          before_assets = {
              asset["name"]: (asset.get("digest"), asset["size"])
              for asset in before["assets"]
          }
          current_assets = {
              asset["name"]: (asset.get("digest"), asset["size"])
              for asset in current["assets"]
          }
          expected_proof = (
              "sha256:" + hashlib.sha256(Path("release-satisfaction-proof.json").read_bytes()).hexdigest(),
              Path("release-satisfaction-proof.json").stat().st_size,
          )
          if current_assets != {**before_assets, "release-satisfaction-proof.json": expected_proof}:
              raise SystemExit("Draft changed outside the single Proof attachment")

          publish_request = {
              key: current[key]
              for key in ("tag_name", "target_commitish", "name", "body")
              if current.get(key) is not None
          }
          publish_request.update(
              {"draft": False, "prerelease": False, "make_latest": "true"}
          )
          Path("release-publish-request.json").write_text(
              json.dumps(publish_request, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          expected = {
              "id": current["id"],
              "settings": {
                  key: (False if key in {"draft", "prerelease"} else current[key])
                  for key in settings
              },
              "assets": current_assets,
          }
          Path("release-publish-expected.json").write_text(
              json.dumps(expected, ensure_ascii=False, sort_keys=True), encoding="utf-8"
          )
          PY

          tag_object_sha="$(jq -er '.tag_object_sha' release-admission.json)"
          commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${commit_sha}" > live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > live-release.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py authority-check \
            --admission release-admission.json --ref live-ref.json --tag live-tag.json \
            --commit live-commit.json --release live-release.json \
            --release-tag "${RELEASE_TAG}" --release-state draft
          # Release ETag does not protect Git refs; live no-bypass ruleset is the linearization authority.
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > ruleset-list.json
          jq -r '.[] | select(.target == "tag") | .id' ruleset-list.json > tag-ruleset-ids.txt
          : > tag-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" >> tag-rulesets.jsonl
          done < tag-ruleset-ids.txt
          jq -s '.' tag-rulesets.jsonl > tag-rulesets.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py ruleset-check \
            --rulesets tag-rulesets.json --repository "${GITHUB_REPOSITORY}" \
            --output release-tag-ruleset-authority.json
          publish_observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py publish-check \
            --proof release-satisfaction-proof.json \
            --snapshot release-candidate-snapshot.json \
            --caller-workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --caller-run-id "${{ github.run_id }}" \
            --caller-run-attempt "${{ github.run_attempt }}" \
            --observed-at "${publish_observed_at}"
          release_id="$(jq -er '.id' release-before-publish.json)"
          release_etag="$(cat release-publish-etag.txt)"
          gh api --method PATCH \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            -H "If-Match: ${release_etag}" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input release-publish-request.json > release-publish-response.json
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          expected = json.loads(
              Path("release-publish-expected.json").read_text(encoding="utf-8")
          )
          published = json.loads(
              Path("release-publish-response.json").read_text(encoding="utf-8")
          )
          settings = {key: published.get(key) for key in expected["settings"]}
          assets = {
              asset["name"]: [asset.get("digest"), asset["size"]]
              for asset in published.get("assets", [])
          }
          if (
              published.get("id") != expected["id"]
              or settings != expected["settings"]
              or assets != expected["assets"]
          ):
              raise SystemExit("Published release differs from Proof-bound transition")
          PY

      - name: Validate live software authority immediately after publish
        shell: bash
        run: |
          set -euo pipefail
          tag_object_sha="$(jq -er '.tag_object_sha' release-admission.json)"
          commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${commit_sha}" > live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > live-release.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py authority-check \
            --admission release-admission.json --ref live-ref.json --tag live-tag.json \
            --commit live-commit.json --release live-release.json \
            --release-tag "${RELEASE_TAG}" --release-state published
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > ruleset-list.json
          jq -r '.[] | select(.target == "tag") | .id' ruleset-list.json > tag-ruleset-ids.txt
          : > tag-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" >> tag-rulesets.jsonl
          done < tag-ruleset-ids.txt
          jq -s '.' tag-rulesets.jsonl > tag-rulesets.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py ruleset-check \
            --rulesets tag-rulesets.json --repository "${GITHUB_REPOSITORY}" \
            --output release-tag-ruleset-authority.json

      - name: Verify immutable Release Attestation
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 20); do
            if gh release verify "${RELEASE_TAG}" --format json > release-attestation.json 2>release-attestation.err; then
              gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-published.json
              immutable="$(jq -r '.immutable // false' release-published.json)"
              if [[ "${immutable}" == "true" ]]; then
                verified=true
                break
              fi
            fi
            sleep 15
          done
          if [[ "${verified}" != "true" ]]; then
            cat release-attestation.err >&2 || true
            echo "Release Attestation or immutable state was not observable within five minutes." >&2
            exit 1
          fi
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path

          expected = json.loads(
              Path("release-publish-expected.json").read_text(encoding="utf-8")
          )
          published = json.loads(Path("release-published.json").read_text(encoding="utf-8"))
          settings = {key: published.get(key) for key in expected["settings"]}
          assets = {
              asset["name"]: [asset.get("digest"), asset["size"]]
              for asset in published.get("assets", [])
          }
          if (
              published.get("id") != expected["id"]
              or settings != expected["settings"]
              or assets != expected["assets"]
              or published.get("immutable") is not True
          ):
              raise SystemExit("Immutable release differs from Proof-bound transition")
          verified = json.loads(
              Path("release-attestation.json").read_text(encoding="utf-8")
          )
          try:
              payload = verified["attestation"]["bundle"]["dsseEnvelope"]["payload"]
              statement = json.loads(base64.b64decode(payload, validate=True))
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("Release Attestation JSON payload is invalid") from exc
          predicate = statement.get("predicate", {})
          subjects = statement.get("subject", [])
          release_subjects = [subject for subject in subjects if "uri" in subject]
          asset_subjects = {
              subject.get("name"): "sha256:" + subject.get("digest", {}).get("sha256", "")
              for subject in subjects
              if subject.get("name")
          }
          expected_assets = {
              asset["name"]: asset.get("digest") for asset in published["assets"]
          }
          admission = json.loads(Path("release-admission.json").read_text(encoding="utf-8"))
          if (
              predicate.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or predicate.get("tag") != os.environ["RELEASE_TAG"]
              or predicate.get("releaseId") != str(published["id"])
              or len(release_subjects) != 1
              or release_subjects[0].get("digest") != {"sha1": admission["tag_object_sha"]}
              or asset_subjects != expected_assets
          ):
              raise SystemExit("Release Attestation content differs from frozen admission")
          PY
          tag_commit_sha="$(jq -er '.commit_sha' release-admission.json)"
          tag_tree_sha="$(jq -er '.tree_sha' release-admission.json)"
          export tag_commit_sha tag_tree_sha
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-published.json").read_text(encoding="utf-8"))
          binding = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag_name": release["tag_name"],
              "commit_sha": os.environ["tag_commit_sha"],
              "tree_sha": os.environ["tag_tree_sha"],
              "assets": sorted(
                  (
                      {
                          "name": asset["name"],
                          "digest": asset.get("digest"),
                          "size_bytes": asset["size"],
                      }
                      for asset in release["assets"]
                  ),
                  key=lambda value: value["name"],
              ),
          }
          Path("release-attestation-binding.json").write_text(
              json.dumps(binding, ensure_ascii=False, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          PY
          release_attestation_digest="sha256:$(sha256sum release-attestation-binding.json | awk '{print $1}')"
          echo "RELEASE_ATTESTATION_DIGEST=${release_attestation_digest}" >> "${GITHUB_ENV}"

      - name: Validate live frozen admission authority after immutable publish
        shell: bash
        run: |
          set -euo pipefail
