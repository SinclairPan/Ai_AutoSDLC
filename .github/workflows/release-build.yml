            --proof release-satisfaction-proof.json --snapshot release-candidate-snapshot.json \
            --caller-workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --caller-run-id "${{ github.run_id }}" --caller-run-attempt "${{ github.run_attempt }}" \
            --observed-at "${certificate_observed_at}"
          gh api --method PATCH \
            -H "User-Agent: ${RELEASE_USER_AGENT}" \
            -H "If-Match: ${certificate_etag}" \
            "repos/${GITHUB_REPOSITORY}/releases/${certificate_release_id}" \
            --input certificate-publish-request.json \
            > certificate-publish-response.json
          if [[ "$(jq -r '.id' certificate-publish-response.json)" != "${certificate_release_id}" ]] \
            || [[ "$(jq -r '.draft' certificate-publish-response.json)" != "false" ]] \
            || [[ "$(jq -r '.prerelease' certificate-publish-response.json)" != "true" ]] \
            || [[ "$(jq -r '.target_commitish' certificate-publish-response.json)" != "${certificate_target}" ]] \
            || [[ "$(jq -r '.name' certificate-publish-response.json)" != "${CERTIFICATE_TITLE}" ]] \
            || [[ "$(jq -r '.body' certificate-publish-response.json)" != "${CERTIFICATE_BODY}" ]] \
            || [[ "$(jq -r '.assets[0].digest' certificate-publish-response.json)" != "${CERTIFICATE_DIGEST}" ]] \
            || [[ "$(jq '.assets | length' certificate-publish-response.json)" != "1" ]]; then
            echo "Certificate publish response differs from current-run identity." >&2
            exit 1
          fi

          evidence_ready=false
          for attempt in $(seq 1 20); do
            if gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/releases/${certificate_release_id}" > certificate-release.json 2>/dev/null \
              && gh release verify "${certificate_tag}" --format json > certificate-attestation.json 2>certificate-attestation.err; then
              immutable="$(jq -r '.immutable // false' certificate-release.json)"
              if [[ "${immutable}" == "true" ]]; then
                existing_digest="$(jq -r '.assets[] | select(.name == "release-certificate.json") | .digest' certificate-release.json)"
                if [[ "${existing_digest}" != "${CERTIFICATE_DIGEST}" ]] \
                  || [[ "$(jq '.assets | length' certificate-release.json)" != "1" ]] \
                  || [[ "$(jq -r '.draft' certificate-release.json)" != "false" ]] \
                  || [[ "$(jq -r '.prerelease' certificate-release.json)" != "true" ]] \
                  || [[ "$(jq -r '.target_commitish' certificate-release.json)" != "${certificate_target}" ]] \
                  || [[ "$(jq -r '.name' certificate-release.json)" != "${CERTIFICATE_TITLE}" ]] \
                  || [[ "$(jq -r '.body' certificate-release.json)" != "${CERTIFICATE_BODY}" ]]; then
                  echo "Certificate immutable release differs from current-run identity." >&2
                  exit 1
                fi
                evidence_ready=true
                break
              fi
            fi
            sleep 15
          done
          if [[ "${evidence_ready}" != "true" ]]; then
            cat certificate-attestation.err >&2 || true
            echo "Certificate evidence release did not become immutable within five minutes." >&2
            exit 1
          fi
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/ref/tags/${certificate_tag}" > certificate-live-ref.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/tags/${certificate_tag_object_sha}" > certificate-live-tag.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" "repos/${GITHUB_REPOSITORY}/git/commits/${certificate_target}" > certificate-live-commit.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py tag-authority-check \
            --admission certificate-admission.json --ref certificate-live-ref.json \
            --tag certificate-live-tag.json --commit certificate-live-commit.json
          gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > ruleset-list.json
          jq -r '.[] | select(.target == "tag") | .id' ruleset-list.json > tag-ruleset-ids.txt
          : > tag-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            gh api -H "User-Agent: ${RELEASE_USER_AGENT}" \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" >> tag-rulesets.jsonl
          done < tag-ruleset-ids.txt
          jq -s '.' tag-rulesets.jsonl > tag-rulesets.json
          uv run --project trusted-writer python trusted-writer/scripts/release_truth.py ruleset-check \
            --rulesets tag-rulesets.json --repository "${GITHUB_REPOSITORY}" \
            --output release-tag-ruleset-authority.json
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path

          admission = json.loads(Path("certificate-admission.json").read_text(encoding="utf-8"))
          certificate = json.loads(Path("release-certificate.json").read_text(encoding="utf-8"))
          proof = json.loads(Path("release-satisfaction-proof.json").read_text(encoding="utf-8"))
          software = json.loads(Path("release-published.json").read_text(encoding="utf-8"))
          evidence = json.loads(Path("certificate-release.json").read_text(encoding="utf-8"))
          verified = json.loads(Path("certificate-attestation.json").read_text(encoding="utf-8"))
          try:
              payload = verified["attestation"]["bundle"]["dsseEnvelope"]["payload"]
              statement = json.loads(base64.b64decode(payload, validate=True))
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("Certificate Attestation JSON payload is invalid") from exc
          predicate = statement.get("predicate", {})
          subjects = statement.get("subject", [])
          release_subjects = [subject for subject in subjects if "uri" in subject]
          asset_subjects = {
              subject.get("name"): "sha256:" + subject.get("digest", {}).get("sha256", "")
              for subject in subjects
              if subject.get("name")
          }
          live_certificate_assets = {
              asset["name"]: asset.get("digest") for asset in evidence.get("assets", [])
          }
          live_software_assets = {
              asset["name"]: asset.get("digest")
              for asset in software.get("assets", [])
              if asset["name"] != "release-satisfaction-proof.json"
          }
          certificate_assets = {
              asset["name"]: asset["digest"] for asset in certificate.get("assets", [])
          }
          if (
              predicate.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or predicate.get("tag") != admission["certificate_tag"]
              or predicate.get("releaseId") != str(admission["numeric_release_id"])
              or len(release_subjects) != 1
              or release_subjects[0].get("digest") != {"sha1": admission["tag_object_sha"]}
              or asset_subjects != live_certificate_assets
              or certificate.get("admission_digest") != admission["software_admission_digest"]
              or certificate.get("proof_digest") != admission["software_proof_digest"]
              or proof.get("proof_digest") != admission["software_proof_digest"]
              or live_software_assets != certificate_assets
          ):
              raise SystemExit("Certificate Attestation content differs from frozen authority")
          PY
