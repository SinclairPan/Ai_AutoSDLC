name: Release Artifact Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify.
        required: true
        default: v1.0.2
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-artifact-smoke-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-zip:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      smoke-verdict: ${{ steps.smoke-verdict.outputs.smoke_verdict }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_ASSET_MACHINE: amd64
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository truth
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up verifier Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download release zip asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetDir = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          if (-not $env:RELEASE_TAG.StartsWith("v")) {
            throw "Release tag must start with v: $env:RELEASE_TAG"
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $assetName = "ai-sdlc-offline-$releaseVersion-windows-$env:RELEASE_ASSET_MACHINE.zip"
          gh release download $env:RELEASE_TAG --pattern $assetName --pattern "$assetName.sha256" --dir $assetDir --repo $env:GITHUB_REPOSITORY

      - name: Install release zip and run CLI smoke
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8

          $assetDir = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-assets"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-zip-smoke"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-zip-evidence"
          Remove-Item -Recurse -Force $smokeRoot, $evidenceRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot, $evidenceRoot | Out-Null

          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $assetName = "ai-sdlc-offline-$releaseVersion-windows-$env:RELEASE_ASSET_MACHINE.zip"
          $archive = Get-Item -LiteralPath (Join-Path $assetDir $assetName) -ErrorAction SilentlyContinue
          $checksumPath = Join-Path $assetDir "$assetName.sha256"
          if (-not $archive -or -not (Test-Path -LiteralPath $checksumPath)) {
            throw "Expected exact release zip asset and SHA256 sidecar were not downloaded: $assetName"
          }
          $checksumParts = (Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+', 2
          $actualArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if (
            $checksumParts.Count -ne 2 -or
            $checksumParts[1] -ne $archive.Name -or
            $checksumParts[0].ToLowerInvariant() -ne $actualArchiveHash
          ) {
            throw "Archive SHA256 verification failed before extraction: $($archive.Name)"
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot -Force
          $bundleDir = Get-ChildItem -Path $smokeRoot -Directory | Select-Object -First 1
          if (-not $bundleDir) {
            throw "Expanded release zip did not contain a bundle directory."
          }

          python packaging/offline/verify_offline_bundle.py $bundleDir.FullName `
            --require-bundled-runtime `
            --require-checksums `
            --expected-package-version $releaseVersion `
            --archive-checksum $archive.FullName $checksumPath
          if ($LASTEXITCODE -ne 0) {
            throw "Pre-install verify_offline_bundle.py failed with exit code $LASTEXITCODE"
          }

          $digest = (Get-FileHash -Algorithm SHA256 "AGENTS.md").Hash.ToLowerInvariant()
          $env:OPENAI_CODEX = "1"
          $env:AI_SDLC_ADAPTER_CANONICAL_SHA256 = "sha256:$digest"
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path $windowsPowerShell)) {
            throw "Expected Windows PowerShell 5.1 at $windowsPowerShell"
          }

          Push-Location $bundleDir.FullName
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\install_offline.ps1 -AddToPath *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "install.log")
          if ($LASTEXITCODE -ne 0) {
            throw "release Windows PowerShell install_offline.ps1 failed with exit code $LASTEXITCODE"
          }
          Pop-Location

          python packaging/offline/verify_offline_bundle.py $bundleDir.FullName `
            --require-bundled-runtime `
            --expected-package-version $releaseVersion `
            --install-log (Join-Path $evidenceRoot "install.log")
          if ($LASTEXITCODE -ne 0) {
            throw "verify_offline_bundle.py failed with exit code $LASTEXITCODE"
          }

          $cliDir = Join-Path $bundleDir.FullName ".venv\Scripts"
          $env:Path = $cliDir + [IO.Path]::PathSeparator + $env:Path
          if (-not (Get-Command ai-sdlc -ErrorAction SilentlyContinue)) {
            throw "Expected ai-sdlc to resolve on PATH after -AddToPath install."
          }
          ai-sdlc --help *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "help.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "release ai-sdlc --help failed with exit code $LASTEXITCODE"
          }
          $actualVersion = (ai-sdlc --version).Trim()
          if ($actualVersion -ne $releaseVersion) {
            throw "Installed CLI version $actualVersion does not match release tag $env:RELEASE_TAG."
          }
          $actualVersion | Out-File -FilePath (Join-Path $evidenceRoot "version.txt") -Encoding utf8

          Push-Location $env:GITHUB_WORKSPACE
          ai-sdlc adapter status *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "adapter-status.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "release ai-sdlc adapter status failed with exit code $LASTEXITCODE"
          }
          ai-sdlc run --dry-run *>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "run-dry-run.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "release ai-sdlc run --dry-run failed with exit code $LASTEXITCODE"
          }
          Pop-Location

      - name: Record explicit release zip smoke verdict
        id: smoke-verdict
        if: always()
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          $verdict = switch ($env:SMOKE_OUTCOME) {
            "success" { "passed" }
            "failure" { "failed" }
            default { "unavailable" }
          }
          "smoke_verdict=$verdict" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enforce explicit release zip smoke failure
        if: steps.smoke-verdict.outputs.smoke_verdict == 'failed'
        shell: pwsh
        run: throw "Release zip smoke assertions failed."

      - name: Collect release zip smoke evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetDir = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-assets"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-zip-smoke"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "ai-sdlc-release-zip-evidence"
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $assetName = "ai-sdlc-offline-$releaseVersion-windows-$env:RELEASE_ASSET_MACHINE.zip"
          $checksumPath = Join-Path $assetDir "$assetName.sha256"
          $bundleDir = Get-ChildItem -LiteralPath $smokeRoot -Directory | Select-Object -First 1
          Copy-Item -LiteralPath (Join-Path $bundleDir.FullName "bundle-manifest.json") -Destination $evidenceRoot
          Copy-Item -LiteralPath (Join-Path $bundleDir.FullName "SHA256SUMS") -Destination $evidenceRoot
          Copy-Item -LiteralPath $checksumPath -Destination $evidenceRoot

      - name: Upload release zip smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-zip-smoke-evidence
          path: ${{ runner.temp }}/ai-sdlc-release-zip-evidence
          if-no-files-found: error

  posix-tar:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    name: ${{ matrix.asset_os }} tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_os: macos
            asset_machine: arm64
            runner: macos-latest
          - asset_os: linux
            asset_machine: amd64
            runner: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_ASSET_OS: ${{ matrix.asset_os }}
      RELEASE_ASSET_MACHINE: ${{ matrix.asset_machine }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository truth
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up verifier Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download release tar asset
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/ai-sdlc-release-assets"
          mkdir -p "${asset_dir}"
          release_version="${RELEASE_TAG#v}"
          if [[ "${RELEASE_TAG}" != "v${release_version}" ]]; then
            echo "Release tag must start with v: ${RELEASE_TAG}" >&2
            exit 1
          fi
          asset_name="ai-sdlc-offline-${release_version}-${RELEASE_ASSET_OS}-${RELEASE_ASSET_MACHINE}.tar.gz"
          gh release download "${RELEASE_TAG}" --pattern "${asset_name}" --pattern "${asset_name}.sha256" --dir "${asset_dir}" --repo "${GITHUB_REPOSITORY}"

      - name: Install release tar and run CLI smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/ai-sdlc-release-assets"
          smoke_root="${RUNNER_TEMP}/ai-sdlc-release-tar-smoke"
          evidence_root="${RUNNER_TEMP}/ai-sdlc-release-tar-evidence"
          rm -rf "${smoke_root}" "${evidence_root}"
          mkdir -p "${smoke_root}" "${evidence_root}"

          release_version="${RELEASE_TAG#v}"
          asset_name="ai-sdlc-offline-${release_version}-${RELEASE_ASSET_OS}-${RELEASE_ASSET_MACHINE}.tar.gz"
          archive="${asset_dir}/${asset_name}"
          checksum_path="${archive}.sha256"
          if [[ ! -f "${archive}" || ! -f "${checksum_path}" ]]; then
            echo "Expected exact ${RELEASE_ASSET_OS} release tar asset and SHA256 sidecar were not downloaded: ${asset_name}" >&2
            exit 1
          fi
          checksum_line="$(tr -d '\r' < "${checksum_path}")"
          expected_archive_hash="${checksum_line%%  *}"
          sidecar_archive_name="${checksum_line#*  }"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_archive_hash="$(sha256sum "${archive}" | awk '{print $1}')"
          else
            actual_archive_hash="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          fi
          expected_archive_hash_lower="$(printf '%s' "${expected_archive_hash}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${expected_archive_hash}" =~ ^[0-9a-fA-F]{64}$ || "${sidecar_archive_name}" != "${asset_name}" || "${actual_archive_hash}" != "${expected_archive_hash_lower}" ]]; then
            echo "Archive SHA256 verification failed before extraction: ${asset_name}" >&2
            exit 1
          fi

          tar xzf "${archive}" -C "${smoke_root}"
          bundle_dir="$(find "${smoke_root}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [[ -z "${bundle_dir}" ]]; then
            echo "Expanded release tar did not contain a bundle directory." >&2
            exit 1
          fi

          python packaging/offline/verify_offline_bundle.py "${bundle_dir}" \
            --require-bundled-runtime \
            --require-checksums \
            --expected-package-version "${release_version}" \
            --archive-checksum "${archive}" "${checksum_path}"

          digest="$(python - <<'PY'
          from pathlib import Path
          import hashlib
          print(hashlib.sha256(Path("AGENTS.md").read_bytes()).hexdigest())
          PY
          )"
          export OPENAI_CODEX=1
          export AI_SDLC_ADAPTER_CANONICAL_SHA256="sha256:${digest}"

          (
            cd "${bundle_dir}"
            ./install_offline.sh --add-to-path 2>&1 | tee "${evidence_root}/install.log"
          )

          python packaging/offline/verify_offline_bundle.py "${bundle_dir}" \
            --require-bundled-runtime \
            --expected-package-version "${release_version}" \
            --install-log "${evidence_root}/install.log"

          export PATH="${HOME}/.local/bin:${PATH}"
          command -v ai-sdlc >/dev/null
          ai-sdlc --help 2>&1 | tee "${evidence_root}/help.txt"
          actual_version="$(ai-sdlc --version)"
          if [[ "${actual_version}" != "${release_version}" ]]; then
            echo "Installed CLI version ${actual_version} does not match release tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          printf '%s\n' "${actual_version}" > "${evidence_root}/version.txt"
          ai-sdlc adapter status 2>&1 | tee "${evidence_root}/adapter-status.txt"
          ai-sdlc run --dry-run 2>&1 | tee "${evidence_root}/run-dry-run.txt"
      - name: Record explicit release tar smoke verdict
        id: smoke-verdict
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          case "${SMOKE_OUTCOME}" in
            success) verdict=passed ;;
            failure) verdict=failed ;;
            *) verdict=unavailable ;;
          esac
          printf '%s_smoke_verdict=%s\n' "${RELEASE_ASSET_OS}" "${verdict}" >> "${GITHUB_OUTPUT}"
          verdict_root="${RUNNER_TEMP}/ai-sdlc-release-tar-verdict"
          mkdir -p "${verdict_root}"
          printf '%s\n' "${verdict}" > "${verdict_root}/${RELEASE_ASSET_OS}.txt"

      - name: Enforce explicit release tar smoke failure
        if: >-
          steps.smoke-verdict.outputs.macos_smoke_verdict == 'failed' ||
          steps.smoke-verdict.outputs.linux_smoke_verdict == 'failed'
        shell: bash
        run: |
          echo "Release ${RELEASE_ASSET_OS} tar smoke assertions failed." >&2
          exit 1

      - name: Upload independent release tar smoke verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_os }}-tar-smoke-verdict
          path: ${{ runner.temp }}/ai-sdlc-release-tar-verdict/${{ matrix.asset_os }}.txt
          if-no-files-found: error

      - name: Collect release tar smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/ai-sdlc-release-assets"
          smoke_root="${RUNNER_TEMP}/ai-sdlc-release-tar-smoke"
          evidence_root="${RUNNER_TEMP}/ai-sdlc-release-tar-evidence"
          release_version="${RELEASE_TAG#v}"
          asset_name="ai-sdlc-offline-${release_version}-${RELEASE_ASSET_OS}-${RELEASE_ASSET_MACHINE}.tar.gz"
          checksum_path="${asset_dir}/${asset_name}.sha256"
          bundle_dir="$(find "${smoke_root}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp "${bundle_dir}/bundle-manifest.json" "${evidence_root}/"
          cp "${bundle_dir}/SHA256SUMS" "${evidence_root}/"
          cp "${checksum_path}" "${evidence_root}/"

      - name: Upload release tar smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_os }}-tar-smoke-evidence
          path: ${{ runner.temp }}/ai-sdlc-release-tar-evidence
          if-no-files-found: error

  posix-smoke-verdicts:
    name: Aggregate independent POSIX smoke verdicts
    needs: posix-tar
    if: >-
      always() &&
      startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-smoke-verdict: ${{ steps.aggregate.outputs.linux_smoke_verdict }}
      macos-smoke-verdict: ${{ steps.aggregate.outputs.macos_smoke_verdict }}
    steps:
      - name: Download independent POSIX smoke verdicts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*-tar-smoke-verdict
          path: posix-smoke-verdicts
          merge-multiple: true

      - name: Aggregate independent POSIX smoke verdicts
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos linux; do
            verdict_path="posix-smoke-verdicts/${platform}.txt"
            if [[ ! -f "${verdict_path}" ]]; then
              echo "Missing independent ${platform} smoke verdict." >&2
              exit 1
            fi
            verdict="$(tr -d '\r\n' < "${verdict_path}")"
            case "${verdict}" in
              passed|failed|unavailable) ;;
              *)
                echo "Invalid independent ${platform} smoke verdict: ${verdict}" >&2
                exit 1
                ;;
            esac
            printf '%s_smoke_verdict=%s\n' "${platform}" "${verdict}" >> "${GITHUB_OUTPUT}"
          done

  record-revocation:
    name: Record Receipt before incident projection
    needs: [windows-zip, posix-smoke-verdicts]
    if: >-
      always() &&
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name || inputs.tag, 'v') &&
      (
        needs.windows-zip.outputs.smoke-verdict == 'failed' ||
        needs.posix-smoke-verdicts.outputs.macos-smoke-verdict == 'failed' ||
        needs.posix-smoke-verdicts.outputs.linux-smoke-verdict == 'failed'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: release-revocation-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      WINDOWS_SMOKE_VERDICT: ${{ needs.windows-zip.outputs.smoke-verdict }}
      MACOS_SMOKE_VERDICT: ${{ needs.posix-smoke-verdicts.outputs.macos-smoke-verdict }}
      LINUX_SMOKE_VERDICT: ${{ needs.posix-smoke-verdicts.outputs.linux-smoke-verdict }}
    steps:
      - name: Checkout exact protected revocation writer revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-writer

      - name: Set up protected writer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install protected writer runtime
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Resolve Certificate and current Receipt generation
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/release-artifact-smoke.yml@refs/heads/main" ]]; then
            echo "Revocation writer authority must come from protected main." >&2
            exit 1
          fi
          certificate_tag="release-truth/${RELEASE_TAG}/certificate/g0"
          mkdir -p release-truth-input/certificate release-truth-input/receipts
          certificate_ready=false
          for attempt in $(seq 1 48); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${certificate_tag}" > release-truth-input/certificate-release.json 2>/dev/null \
              && [[ "$(jq -r '.immutable // false' release-truth-input/certificate-release.json)" == "true" ]] \
              && gh release verify "${certificate_tag}" --format json >/dev/null 2>&1; then
              gh release download "${certificate_tag}" \
                --pattern release-certificate.json \
                --dir release-truth-input/certificate
              certificate_ready=true
              break
            fi
            sleep 15
          done
          if [[ "${certificate_ready}" != "true" ]]; then
            echo "Certificate evidence was not observable within twelve minutes." >&2
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-truth-input/release-pages.json
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          pages = json.loads(
              Path("release-truth-input/release-pages.json").read_text(encoding="utf-8")
          )
          releases = [release for page in pages for release in page]
          prefix = f"release-truth/{os.environ['RELEASE_TAG']}/revocation/g"
          receipts = []
          drafts = []
          for release in releases:
              tag = str(release.get("tag_name") or "")
              if not tag.startswith(prefix):
                  continue
              generation = tag.removeprefix(prefix)
              if not generation.isdigit() or int(generation) < 1:
                  raise SystemExit("Receipt evidence release authority is invalid")
              if release.get("draft") is True:
                  if (
                      release.get("prerelease") is not True
                      or release.get("immutable") is True
                  ):
                      raise SystemExit("Receipt draft authority is invalid")
                  drafts.append({"generation": int(generation), "tag": tag})
                  continue
              if (
                  release.get("prerelease") is not True
                  or release.get("immutable") is not True
              ):
                  raise SystemExit("Receipt evidence release authority is invalid")
              assets = release.get("assets")
              if (
                  not isinstance(assets, list)
                  or len(assets) != 1
                  or assets[0].get("name") != "release-revocation-receipt.json"
              ):
                  raise SystemExit("Receipt evidence release asset set is invalid")
              receipts.append({"generation": int(generation), "tag": tag})
          receipts.sort(key=lambda value: value["generation"])
          if [item["generation"] for item in receipts] != list(
              range(1, len(receipts) + 1)
          ):
              raise SystemExit("Receipt evidence generation gap or fork detected")
          if len(drafts) > 1 or (
              drafts and drafts[0]["generation"] != len(receipts) + 1
          ):
              raise SystemExit("Receipt draft generation is not recoverable")
          Path("release-truth-input/receipt-tags.json").write_text(
              json.dumps(receipts, sort_keys=True), encoding="utf-8"
          )
          PY

          while IFS= read -r item; do
            generation="$(jq -r '.generation' <<<"${item}")"
            tag="$(jq -r '.tag' <<<"${item}")"
            target="release-truth-input/receipts/g${generation}"
            mkdir -p "${target}"
            gh release verify "${tag}" --format json >/dev/null
            gh release download "${tag}" \
              --pattern release-revocation-receipt.json \
              --dir "${target}"
          done < <(jq -c '.[]' release-truth-input/receipt-tags.json)
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > release-truth-input/workflow-run.json

          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          from ai_sdlc.core.release_truth import build_revocation_receipt
          from ai_sdlc.core.release_truth_models import (
              ReleaseCertificate,
              ReleaseRevocationReceipt,
              RevocationSignal,
          )

          def canonical_digest(value: object) -> str:
              encoded = json.dumps(
                  value, ensure_ascii=False, separators=(",", ":"), sort_keys=True
              ).encode()
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          certificate_path = Path(
              "release-truth-input/certificate/release-certificate.json"
          )
          certificate_bytes = certificate_path.read_bytes()
          certificate_release = json.loads(
              Path("release-truth-input/certificate-release.json").read_text(
                  encoding="utf-8"
              )
          )
          certificate_asset = certificate_release["assets"][0]
          if (
              len(certificate_release["assets"]) != 1
              or certificate_asset["name"] != "release-certificate.json"
              or certificate_asset.get("digest")
              != "sha256:" + hashlib.sha256(certificate_bytes).hexdigest()
              or certificate_asset["size"] != len(certificate_bytes)
          ):
              raise SystemExit("Certificate evidence asset digest differs")
          certificate = ReleaseCertificate.model_validate_json(certificate_bytes)
          run = json.loads(
              Path("release-truth-input/workflow-run.json").read_text(encoding="utf-8")
          )
          signal_evidence = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "release_tag": os.environ["RELEASE_TAG"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          signal = RevocationSignal(
              reason_code="post_publish_smoke_failed",
              evidence_digest=canonical_digest(signal_evidence),
              work_item_id=(
                  f"release-smoke-{os.environ['GITHUB_RUN_ID']}"
              ),
              observed_at=run["created_at"],
          )

          bindings = json.loads(
              Path("release-truth-input/receipt-tags.json").read_text(encoding="utf-8")
          )
          receipts = []
          predecessor = ""
          for expected_generation, binding in enumerate(bindings, start=1):
              path = (
                  Path("release-truth-input/receipts")
                  / f"g{expected_generation}"
                  / "release-revocation-receipt.json"
              )
              content = path.read_bytes()
              pages = json.loads(
                  Path("release-truth-input/release-pages.json").read_text(
                      encoding="utf-8"
                  )
              )
              release = next(
                  item
                  for page in pages
                  for item in page
                  if item.get("tag_name") == binding["tag"]
              )
              asset = release["assets"][0]
              if (
                  asset.get("digest")
                  != "sha256:" + hashlib.sha256(content).hexdigest()
                  or asset["size"] != len(content)
              ):
                  raise SystemExit("Receipt evidence asset digest differs")
              receipt = ReleaseRevocationReceipt.model_validate_json(content)
              if (
                  receipt.generation != expected_generation
                  or receipt.repository != certificate.repository
                  or receipt.tag_name != certificate.tag_name
                  or receipt.certificate_digest != certificate.certificate_digest
                  or receipt.predecessor_receipt_digest != predecessor
              ):
                  raise SystemExit("Receipt chain identity differs")
              receipts.append(receipt)
              predecessor = receipt.receipt_digest

          replay = next(
              (
                  receipt
                  for receipt in receipts
                  if receipt.reason_code == signal.reason_code
                  and receipt.evidence_digest == signal.evidence_digest
                  and receipt.work_item_id == signal.work_item_id
              ),
              None,
          )
          if replay is None:
              receipt = build_revocation_receipt(
                  certificate,
                  receipts[-1] if receipts else None,
                  signal,
                  expected_generation=len(receipts) + 1,
              )
              idempotent = False
          else:
              receipt = replay
              idempotent = True
          Path("release-revocation-receipt.json").write_text(
              json.dumps(receipt.model_dump(mode="json"), ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          Path("receipt-metadata.json").write_text(
              json.dumps(
                  {
                      "generation": receipt.generation,
                      "idempotent": idempotent,
                      "receipt_digest": receipt.receipt_digest,
                      "target_commit": certificate.commit_sha,
                  },
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          next_generation="$(jq -r '.generation' receipt-metadata.json)"
          receipt_tag="release-truth/${RELEASE_TAG}/revocation/g${next_generation}"
          echo "next_generation=${next_generation}" >> "${GITHUB_OUTPUT}"
          echo "receipt_tag=${receipt_tag}" >> "${GITHUB_OUTPUT}"
          echo "receipt_digest=$(jq -r '.receipt_digest' receipt-metadata.json)" >> "${GITHUB_OUTPUT}"
          echo "target_commit=$(jq -r '.target_commit' receipt-metadata.json)" >> "${GITHUB_OUTPUT}"
          echo "idempotent=$(jq -r '.idempotent' receipt-metadata.json)" >> "${GITHUB_OUTPUT}"

      - name: Append immutable Receipt generation
        id: append
        if: steps.receipt.outputs.idempotent != 'true'
        shell: bash
        env:
          RECEIPT_TAG: ${{ steps.receipt.outputs.receipt_tag }}
          TARGET_COMMIT: ${{ steps.receipt.outputs.target_commit }}
        run: |
          set -euo pipefail
          receipt_tag="${RECEIPT_TAG}"
          EXPECTED_DIGEST="sha256:$(sha256sum release-revocation-receipt.json | awk '{print $1}')"
          EXPECTED_TITLE="Release Truth ${RELEASE_TAG} Revocation g${{ steps.receipt.outputs.next_generation }}"
          EXPECTED_BODY="Append-only revocation receipt for failed post-publish smoke."
          export EXPECTED_DIGEST EXPECTED_TITLE EXPECTED_BODY
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${receipt_tag}" > receipt-release.json 2>/dev/null; then
            if ! gh release create "${receipt_tag}" \
              release-revocation-receipt.json#release-revocation-receipt.json \
              --target "${TARGET_COMMIT}" \
              --title "${EXPECTED_TITLE}" \
              --notes "${EXPECTED_BODY}" \
              --draft \
              --prerelease \
              --latest=false; then
              echo "Receipt draft create returned non-zero; resolving GitHub authority."
            fi
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${receipt_tag}" > receipt-release.json 2>/dev/null; then
            echo "Receipt draft was not recoverable after create." >&2
            exit 1
          fi

          receipt_release_id="$(jq -r '.id' receipt-release.json)"
          uv run --project trusted-writer python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          release = json.loads(Path("receipt-release.json").read_text(encoding="utf-8"))
          assets = release.get("assets")
          draft = release.get("draft")
          if (
              release.get("tag_name") != os.environ["RECEIPT_TAG"]
              or not isinstance(draft, bool)
              or release.get("prerelease") is not True
              or (draft and release.get("immutable") is True)
              or release.get("target_commitish") != os.environ["TARGET_COMMIT"]
              or release.get("name") != os.environ["EXPECTED_TITLE"]
              or release.get("body") != os.environ["EXPECTED_BODY"]
              or not isinstance(assets, list)
              or len(assets) > 1
              or (not draft and len(assets) != 1)
              or (
                  assets
                  and (
                      assets[0].get("name") != "release-revocation-receipt.json"
                      or assets[0].get("digest") != os.environ["EXPECTED_DIGEST"]
                  )
              )
          ):
              raise SystemExit("Receipt release differs from expected recovery identity")
          PY
          draft="$(jq -r '.draft' receipt-release.json)"
          if [[ "${draft}" == "true" ]]; then
            if [[ "$(jq '.assets | length' receipt-release.json)" == "0" ]]; then
              gh release upload "${receipt_tag}" \
                release-revocation-receipt.json#release-revocation-receipt.json
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${receipt_tag}" > receipt-release.json
            fi
            actual_digest="$(jq -r '.assets[] | select(.name == "release-revocation-receipt.json") | .digest' receipt-release.json)"
            if [[ "${actual_digest}" != "${EXPECTED_DIGEST}" ]] \
              || [[ "$(jq '.assets | length' receipt-release.json)" != "1" ]]; then
              echo "Receipt draft asset differs from expected recovery identity." >&2
              exit 1
            fi
            jq -n \
              --arg target_commitish "${TARGET_COMMIT}" \
              --arg name "${EXPECTED_TITLE}" \
              --arg body "${EXPECTED_BODY}" \
              '{target_commitish:$target_commitish,name:$name,body:$body,draft:false,prerelease:true,make_latest:"false"}' \
              > receipt-publish-request.json
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${receipt_release_id}" \
              --input receipt-publish-request.json \
              > receipt-publish-response.json
            if [[ "$(jq -r '.id' receipt-publish-response.json)" != "${receipt_release_id}" ]] \
              || [[ "$(jq -r '.draft' receipt-publish-response.json)" != "false" ]] \
              || [[ "$(jq -r '.prerelease' receipt-publish-response.json)" != "true" ]]; then
              echo "Receipt publish response differs from expected recovery identity." >&2
              exit 1
            fi
          fi

          receipt_ready=false
          for attempt in $(seq 1 20); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${receipt_tag}" > receipt-release.json 2>/dev/null; then
              actual_digest="$(jq -r '.assets[] | select(.name == "release-revocation-receipt.json") | .digest' receipt-release.json)"
              immutable="$(jq -r '.immutable // false' receipt-release.json)"
              if [[ "${actual_digest}" != "${EXPECTED_DIGEST}" ]]; then
                echo "Receipt generation fork detected." >&2
                exit 1
              fi
              if [[ "${immutable}" == "true" ]] \
                && gh release verify "${receipt_tag}" --format json >/dev/null 2>&1; then
                if [[ "$(jq -r '.tag_name' receipt-release.json)" != "${RECEIPT_TAG}" ]] \
                  || [[ "$(jq -r '.draft' receipt-release.json)" != "false" ]] \
                  || [[ "$(jq -r '.prerelease' receipt-release.json)" != "true" ]] \
                  || [[ "$(jq -r '.target_commitish' receipt-release.json)" != "${TARGET_COMMIT}" ]] \
                  || [[ "$(jq -r '.name' receipt-release.json)" != "${EXPECTED_TITLE}" ]] \
                  || [[ "$(jq -r '.body' receipt-release.json)" != "${EXPECTED_BODY}" ]] \
                  || [[ "$(jq '.assets | length' receipt-release.json)" != "1" ]]; then
                  echo "Receipt published release differs from expected recovery identity." >&2
                  exit 1
                fi
                receipt_ready=true
                break
              fi
            fi
            sleep 15
          done
          if [[ "${receipt_ready}" != "true" ]]; then
            echo "Receipt evidence release did not become immutable within five minutes." >&2
            exit 1
          fi

      - name: Attest immutable Receipt generation
        uses: actions/attest@v4
        with:
          subject-path: release-revocation-receipt.json

      - name: Project stop recommendation and incident
        if: >-
          steps.receipt.outputs.idempotent == 'true' ||
          steps.append.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Release Truth revocation"
            echo "- release_tag: ${RELEASE_TAG}"
            echo "- release_trust: untrusted"
            echo "- reason_code: post_publish_smoke_failed"
            echo "- receipt_tag: ${{ steps.receipt.outputs.receipt_tag }}"
            echo "- receipt_digest: ${{ steps.receipt.outputs.receipt_digest }}"
            echo "- work_item: release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "- next: stop actionable recommendation and investigate the immutable Receipt evidence"
          } >> "${GITHUB_STEP_SUMMARY}"
